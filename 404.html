<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Дмитрий</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #3a7bd5 url(/assets/wallpaper.svg) center / cover;
    font: 13px/1.4 Tahoma, "Segoe UI", Verdana, sans-serif;
  }
  .win { width: min(400px, 100%); padding: 0 3px 3px; background: #0a3fd0; border-radius: 8px 8px 0 0; box-shadow: 0 8px 26px rgba(0, 20, 70, .32); }
  .bar { height: 30px; display: flex; align-items: center; padding: 0 8px; color: #fff; font: 700 13px "Trebuchet MS", Tahoma, sans-serif; text-shadow: 1px 1px #0f1089;
    background: linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #003dd7 100%); margin: 0 -3px; border-radius: 7px 7px 0 0; }
  .body { background: #ece9d8; padding: 18px 16px 14px; }
  .row { display: flex; gap: 14px; }
  .ico { flex: none; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(#f59a74, #c8361a); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  p { margin: 4px 0 0; }
  .btns { text-align: center; margin-top: 16px; }
  a { display: inline-block; padding: 4px 18px; border: 1px solid #003c74; border-radius: 3px; color: #000; text-decoration: none;
    background: linear-gradient(180deg, #fff 0%, #ecebe6 86%, #d6d0c5 100%); }
</style>
</head>
<body>
  <div class="win" role="alertdialog" aria-labelledby="t">
    <div class="bar" id="t">Файл не найден</div>
    <div class="body">
      <div class="row"><div class="ico" aria-hidden="true">×</div>
        <p>Не удаётся найти эту страницу.<br>Проверьте адрес или вернитесь на рабочий стол.</p></div>
      <div class="btns"><a href="/">На рабочий стол</a></div>
    </div>
  </div>
</body>
</html>
